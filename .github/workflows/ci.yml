name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  CI: "true"

jobs:
  gates:
    name: format + build + test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore GrainWallet.slnx

      - name: Format check
        run: dotnet format GrainWallet.slnx --verify-no-changes --no-restore --severity error

      - name: Build
        run: dotnet build GrainWallet.slnx -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test GrainWallet.slnx -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  automerge:
    name: Auto-merge Dependabot patch updates
    needs: [gates]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v2
      - name: Merge when every update in the PR is a patch
        if: steps.meta.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          t="${PR_TITLE#chore: }"
          subject="(chore) ${t,,} (#$PR_NUMBER)"
          # needs: [gates] already guarantees the required check finished before this
          # job started, but GitHub's merge-eligibility state (used by the mergePullRequest
          # GraphQL call inside `gh pr merge`) lags the check's own completion by a few
          # minutes (eventual consistency), so the first merge attempt can still fail with
          # "Required status check ... is expected." Retry the merge itself with backoff
          # instead of polling the check again, since the check has already reported.
          max_attempts=6
          delay=15
          attempt=1
          until gh pr merge "$PR_URL" --squash --subject "$subject" --body ""; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "gh pr merge still failing after $attempt attempts, giving up" >&2
              exit 1
            fi
            echo "merge attempt $attempt failed, GitHub's merge-eligibility state may still be settling, retrying in ${delay}s" >&2
            sleep "$delay"
            attempt=$((attempt + 1))
          done
